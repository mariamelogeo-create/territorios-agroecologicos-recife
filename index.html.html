  function criarIcone(categoria) {
    const c = config[categoria] || { emoji: "📍", cor: "#555" };
    return L.divIcon({
      html: `<div class="icone-marcador" style="background:${c.cor};">${c.emoji}</div>`,

      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -15]
    });
  }

  Object.keys(config).forEach(cat => {
    camadas[cat] = L.layerGroup();
  });

  pontos.forEach(p => {

      <div class="popup-titulo">${p.nome}</div>
      <div class="popup-linha" style="color:${c.cor}; font-weight:bold;">${p.categoria}</div>
    `);
    if (camadas[p.categoria]) {
      marcador.addTo(camadas[p.categoria]);
    }
  });

  Object.values(camadas).forEach(layer => layer.addTo(map));

  const overlays = {};
  Object.keys(config).forEach(cat => {
    const c = config[cat];
    overlays[`${c.emoji} ${cat}`] = camadas[cat];
  });
  L.control.layers(null, overlays, { collapsed: false }).addTo(map);
